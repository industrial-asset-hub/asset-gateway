services:
  auth-proxy-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/auth-proxy-agent:1.4.2'
    command: ["-gateway-version=1.7.3", "-root-ca-path=/certs/", "-partner-app-proxy=ams-authproxy-agent.cdm-proxy-redirect.", "-grpc-registry-address=grpc-server-registry:50051"]
    networks:
      - 01-cdm
      - cdm-proxy-redirect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cdm-cfg:/shared-cfg/
      - ./cfg-data/:/cfg-data/
      - certs:/certs/
      # Injecting a custom certificate authority (CA)
      # For example, to allow traffic passing a corporate proxy. The proxy
      # uses certificates from a corporate CA.
      # -./my-ca.crt:/etc/ssl/certs/my-ca.crt

  wfx-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/wfx-agent:1.0.3'
    environment:
      - PORT=8060
      - AGENT_POLLING_INTERVAL=10
    command:
      - '-wfx-service=auth-proxy-agent/wfx-southbound/'
    networks:
      - 01-cdm
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - auth-proxy-agent

  discovery-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/discovery-agent:1.4.4'
    command: ["-wfx-service=wfx-agent:8060", "-inventory-api-service-address=auth-proxy-agent/inventory/", "-grpc-server-registry=grpc-server-registry:50051", "-credential-storage-api-service-address=auth-proxy-agent/credentials", "-gateway-network-provisioner-address=host.docker.internal:18080/network"]
    networks:
      - 01-cdm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - wfx-agent

  remote-access-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/remote-access-agent:1.2.2'
    command: ["-wfx-handler=wfx-agent:8060", "-remote-access-service-address=auth-proxy-agent/remote-access", "-max-retry-count=4"]
    networks:
      - 01-cdm
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - wfx-agent

  grpc-server-registry:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/grpc-server-registry:0.1.20'
    networks:
      - 01-cdm
    ports:
      - "50051:50051"

  default-ip-scanner:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/generic-asset-scanner:1.6.0'
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    pid: "host"
    volumes:
    - cdm-cfg:/shared-cfg/
    security_opt:
      - apparmor:unconfined
    command:
      - '-grpc-server-endpoint-address=host.docker.internal'
      - '-grpc-server-address=:18081'
      - '-grpc-registry-address=localhost:50051'

  native-os-al:
      image: 'ghcr.io/industrial-asset-hub/iah/native-os-al:3.0.3'
      volumes:
        - cdm-cfg:/shared-cfg/:ro
      networks:
        - 01-cdm
      restart: always
      mem_limit: 30mb
      cap_drop:
        - ALL
      cap_add:
        - CAP_SYS_ADMIN
        - CAP_SYS_PTRACE
      security_opt:
        - apparmor:unconfined
      pid: host
      command:
        - '-grpc-server-endpoint-address=native-os-al'
        - '-grpc-server-address=0.0.0.0:8084'
        - '-grpc-registry-address=grpc-server-registry:50051'

  gateway-network-provisioner:
      restart: always
      image: 'ghcr.io/industrial-asset-hub/iah/gateway-network-provisioner:0.1.3'
      network_mode: host  # HTTP REST API available on host port 18080
      cap_add:
        - NET_ADMIN
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

networks:
  01-cdm:
    name: cdm
  cdm-proxy-redirect:
    name: cdm-proxy-redirect
    driver: bridge

volumes:
  cdm-cfg:
    name: cdm-cfg
  certs:
    name: cdm-certs
