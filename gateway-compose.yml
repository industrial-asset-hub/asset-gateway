services:
  auth-proxy-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/auth-proxy-agent:1.3.8'
    command: ["-gateway-version=1.6.2", "-root-ca-path=/certs/", "-partner-app-proxy=ams-authproxy-agent.cdm-proxy-redirect."]
    networks:
      - 01-cdm
      - cdm-proxy-redirect
    volumes:
      - cdm-cfg:/shared-cfg/
      - ./cfg-data/:/cfg-data/
      - certs:/certs/
      # Injecting a custom certificate authority (CA)
      # For example, to allow traffic passing a corporate proxy. The proxy
      # uses certificates from a corporate CA.
      # -./my-ca.crt:/etc/ssl/certs/my-ca.crt

  discovery-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/discovery-agent:1.1.41'
    command: ["-wfx-service=auth-proxy-agent/wfx-southbound/", "-inventory-api-service-address=auth-proxy-agent/inventory/", "-grpc-server-registry=grpc-server-registry:50051", "-credential-storage-api-service-address=auth-proxy-agent/credentials"]
    networks:
      - 01-cdm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - auth-proxy-agent

  remote-access-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/remote-access-agent:1.1.25'
    command: ["-wfx-handler=auth-proxy-agent/wfx-southbound/", "-remote-access-service-address=auth-proxy-agent/remote-access", "-max-retry-count=4"]
    networks:
      - 01-cdm
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - auth-proxy-agent

  grpc-server-registry:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/grpc-server-registry:0.1.18'
    networks:
      - 01-cdm
    ports:
      - "50051:50051"

  generic-asset-scanner:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/generic-asset-scanner:1.4.10'
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    pid: "host"
    volumes:
    - cdm-cfg:/shared-cfg/
    security_opt:
      - apparmor:unconfined
    command:
      - '-grpc-server-endpoint-address=host.docker.internal'
      - '-grpc-server-address=:8081'
      - '-grpc-registry-address=localhost:50051'

  native-os-al:
      image: 'ghcr.io/industrial-asset-hub/iah/native-os-al:2.0.7'
      volumes:
        - cdm-cfg:/shared-cfg/:ro
      networks:
        - 01-cdm
      restart: always
      mem_limit: 30mb
      cap_drop:
        - ALL
      cap_add:
        - CAP_SYS_ADMIN
        - CAP_SYS_PTRACE
      security_opt:
        - apparmor:unconfined
      pid: host
      command:
        - '-grpc-server-endpoint-address=native-os-al'
        - '-grpc-server-address=0.0.0.0:8084'
        - '-grpc-registry-address=grpc-server-registry:50051'

networks:
  01-cdm:
    name: cdm
  cdm-proxy-redirect:
    name: cdm-proxy-redirect
    driver: bridge

volumes:
  cdm-cfg:
    name: cdm-cfg
  certs:
    name: cdm-certs
