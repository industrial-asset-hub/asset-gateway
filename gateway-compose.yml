services:
  auth-proxy-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/auth-proxy-agent:1.7.6@sha256:9f34622f81f0fbb490f5dcf340db4c4c959a9f473445108020debdbde9e3ab59'
    command: ["-gateway-version=1.7.6", "-root-ca-path=/certs/", "-partner-app-proxy=ams-authproxy-agent.cdm-proxy-redirect.", "-grpc-registry-address=grpc-server-registry:50051"]
    networks:
      - 01-cdm
      - cdm-proxy-redirect
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cdm-cfg:/shared-cfg/
      - ./cfg-data/:/cfg-data/
      - certs:/certs/
      # Injecting a custom certificate authority (CA)
      # For example, to allow traffic passing a corporate proxy. The proxy
      # uses certificates from a corporate CA.
      # -./my-ca.crt:/etc/ssl/certs/my-ca.crt

  wfx-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/wfx-agent:1.7.6@sha256:c89ceddec373bb1ca5658041b6283200146716c2f8a963119a62f58d9ace4e4e'
    environment:
      - PORT=8060
      - AGENT_POLLING_INTERVAL=10
    command:
      - '-wfx-service=auth-proxy-agent/wfx-southbound/'
    networks:
      - 01-cdm
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - auth-proxy-agent

  discovery-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/discovery-agent:1.7.6@sha256:9ef1d39764e08eca10810cd2c7bb42934f4beeb7c32a5bee77ea4b5d71677446'
    command: ["-wfx-service=wfx-agent:8060", "-inventory-api-service-address=auth-proxy-agent/inventory/", "-grpc-server-registry=grpc-server-registry:50051", "-credential-storage-api-service-address=auth-proxy-agent/credentials", "-gateway-network-provisioner-address=host.docker.internal:18080/network"]
    networks:
      - 01-cdm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - wfx-agent

  remote-access-agent:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/remote-access-agent:1.7.6@sha256:54b8e9dc5d2de766171d8a083e7720c8384af3f6fa0c6208f9c24ee5b1103726'
    command: ["-wfx-handler=wfx-agent:8060", "-remote-access-service-address=auth-proxy-agent/remote-access", "-max-retry-count=4"]
    networks:
      - 01-cdm
    volumes:
      - cdm-cfg:/shared-cfg/
    depends_on:
      - wfx-agent

  grpc-server-registry:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/grpc-server-registry:1.7.6@sha256:f21f3de4865afaabaa4e773032c488bb74fc7d91a0244c37c2e098c4ba6dbbf6'
    networks:
      - 01-cdm
    ports:
      - "50051:50051"

  default-ip-scanner:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/generic-asset-scanner:1.7.6@sha256:e60dc6e2c107dea7cf5f83cb43770570f7eb5f382f78bfe30012f67a3e05f219'
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    pid: "host"
    volumes:
    - cdm-cfg:/shared-cfg/
    security_opt:
      - apparmor:unconfined
    command:
      - '-grpc-server-endpoint-address=host.docker.internal'
      - '-grpc-server-address=:18081'
      - '-grpc-registry-address=localhost:50051'

  native-os-al:
      image: 'ghcr.io/industrial-asset-hub/iah/native-os-al:1.7.6@sha256:95a68a4293726b0eec38951f9cd3551aced08fa7ea7c112b2331d4a93a750691'
      volumes:
        - cdm-cfg:/shared-cfg/:ro
      networks:
        - 01-cdm
      restart: always
      mem_limit: 30mb
      cap_drop:
        - ALL
      cap_add:
        - CAP_SYS_ADMIN
        - CAP_SYS_PTRACE
      security_opt:
        - apparmor:unconfined
      pid: host
      command:
        - '-grpc-server-endpoint-address=native-os-al'
        - '-grpc-server-address=0.0.0.0:8084'
        - '-grpc-registry-address=grpc-server-registry:50051'

  gateway-network-provisioner:
      restart: always
      image: 'ghcr.io/industrial-asset-hub/iah/gateway-network-provisioner:1.7.6@sha256:e11a7ba57b4e293c04309eca61926ddde60b2e129d20ce0bce35743a14905054'
      network_mode: host  # HTTP REST API available on host port 18080
      cap_add:
        - NET_ADMIN
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

networks:
  01-cdm:
    name: cdm
  cdm-proxy-redirect:
    name: cdm-proxy-redirect
    driver: bridge

volumes:
  cdm-cfg:
    name: cdm-cfg
  certs:
    name: cdm-certs
