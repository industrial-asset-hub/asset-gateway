# SNMP Asset link for Industrial Asset Hub
# Depends on Industrial Asset Hub gateway
services:
  snmp-driver:
    restart: always
    image: 'ghcr.io/industrial-asset-hub/iah/snmp-driver:1.7.0@sha256:0acf4f7700c37202276eeb094cefdacffa578815ac572215a6cddf3c621d0ca5'
    networks:
      - 01-cdm
    mem_limit: 300mb
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./cfg-data:/shared-cfg/
    command:
      - '--grpc-address=0.0.0.0:8081'
      - '--grpc-server-registry=grpc-server-registry:50051'

networks:
  01-cdm:
    name: cdm
    external: true
